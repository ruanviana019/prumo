<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prumo – finanças pessoais</title>
<style>
:root{--bg:#f6f4ef;--sf:#fff;--tx:#1d2a26;--mu:#6b7a74;--ac:#0f766e;--ac2:#e3f1ee;--rd:#c2410c;--gn:#15803d;--bd:#e3ded3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111716;--sf:#1a2220;--tx:#e8efec;--mu:#92a39c;--ac:#34d1bf;--ac2:#18312d;--rd:#fb923c;--gn:#4ade80;--bd:#2a3532;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111716;--sf:#1a2220;--tx:#e8efec;--mu:#92a39c;--ac:#34d1bf;--ac2:#18312d;--rd:#fb923c;--gn:#4ade80;--bd:#2a3532;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:9;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;max-width:760px;margin:auto}
header b{font-size:20px;color:var(--ac);letter-spacing:.5px}.mn{display:flex;align-items:center;gap:6px}.mn span{min-width:130px;text-align:center;font-weight:600}.mn span::first-letter{text-transform:uppercase}
main{max-width:760px;margin:auto;padding:0 16px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:10px;padding:8px 12px}
button.pri{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:600}button.ghost{background:none}button.ic{padding:4px 9px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.grid .card{margin:0;padding:10px 6px;text-align:center}.grid .v{font-size:15px;overflow-wrap:anywhere}[hidden]{display:none!important}
.k{font-size:12px;color:var(--mu)}.v{font-weight:700;font-size:17px}.in{color:var(--gn)}.out{color:var(--rd)}
h2{font-size:16px;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.it{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}.it:last-child{border:0}
.it .e{font-size:22px;width:34px;text-align:center}.it .m{flex:1;min-width:0}.it .m div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;margin:6px 0}.chips button.on,nav button.on{background:var(--ac2);color:var(--ac);border-color:var(--ac)}
.bar{height:8px;background:var(--ac2);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac)}.bar i.w{background:var(--rd)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--bd);display:flex;justify-content:center;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:9}
nav button{flex:1;max-width:120px;border:0;background:none;font-size:12px;padding:6px 2px}nav button span{display:block;font-size:20px}
.fab{position:fixed;right:18px;bottom:calc(82px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;font-size:28px;padding:0;z-index:8;box-shadow:0 4px 14px #0003}
input,select{font:inherit;width:100%;padding:9px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);margin-top:4px}input[type=checkbox]{width:auto}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--sf);color:var(--tx);width:min(440px,94vw);padding:16px;max-height:90vh;overflow:auto}dialog::backdrop{background:#0006}
label{display:block;margin:8px 0;font-size:13px;color:var(--mu)}h3{margin:0 0 4px}.empty{text-align:center;color:var(--mu);padding:20px}
.warn{background:var(--ac2);border:1px solid var(--ac);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.tag{font-size:11px;border:1px solid var(--rd);color:var(--rd);border-radius:6px;padding:0 5px;margin-left:4px}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;overflow-x:auto}.bars div{flex:1;min-width:38px;text-align:center;font-size:11px;color:var(--mu)}.bars i{display:inline-block;width:12px;border-radius:4px 4px 0 0;margin:0 1px}
</style></head><body>
<header><b>Prumo</b><div class="mn"><button class="ic" data-a="pm" aria-label="Mês anterior">‹</button><span id="ml"></span><button class="ic" data-a="nm" aria-label="Próximo mês">›</button></div></header>
<main><div id="warn" class="warn" hidden>O armazenamento do navegador não está disponível. Seus dados valem só nesta sessão.</div><div id="app"></div></main>
<button class="pri fab" data-a="newtx" aria-label="Novo lançamento">+</button>
<nav><button data-v="home" data-a="go"><span>🏠</span>Início</button><button data-v="tx" data-a="go"><span>🧾</span>Lançamentos</button><button data-v="cards" data-a="go"><span>💳</span>Cartões</button><button data-v="plan" data-a="go"><span>🎯</span>Planejar</button><button data-v="rep" data-a="go"><span>📊</span>Relatórios</button></nav>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),KEY='prumo.v1';
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const today=new Date().toLocaleDateString('sv');
let ok=true,view='home',ym=today.slice(0,7),flt='all',q='';
const defCats=[['moradia','Moradia','🏠'],['mercado','Mercado','🛒'],['transporte','Transporte','🚌'],['lazer','Lazer','🎬'],['saude','Saúde','💊'],['educ','Educação','📚'],['renda','Renda','💼'],['outros','Outros','📦'],['fat','Fatura','💳']].map(c=>({id:c[0],name:c[1],e:c[2]}));
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){ok=false}return null}
let S=load()||{acc:[{id:'a1',name:'Conta principal',b0:0}],cards:[],cats:defCats,tx:[],bud:{},goals:[]};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){ok=false}render()}
const mon=d=>d.slice(0,7);
const addM=(m,n)=>{const[y,k]=m.split('-').map(Number);return new Date(Date.UTC(y,k-1+n,1)).toISOString().slice(0,7)};
const dAdd=(d,n)=>addM(mon(d),n)+'-'+String(Math.min(+d.slice(8),28)).padStart(2,'0');
const ml=m=>new Date(m+'-01T12:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
const fd=d=>d.slice(8)+'/'+d.slice(5,7);
const cat=id=>S.cats.find(c=>c.id===id)||{name:'—',e:'❔'};
const card=id=>S.cards.find(c=>c.id===id);
const inv=t=>{const c=card(t.card);if(!c)return mon(t.date);return +t.date.slice(8)>c.close?addM(mon(t.date),1):mon(t.date)};
const sum=a=>a.reduce((s,t)=>s+t.amount,0);
const monthTx=()=>S.tx.filter(t=>mon(t.date)===ym);
const spent=c=>sum(monthTx().filter(t=>t.type==='out'&&!t.inv&&t.cat===c));
const bal=a=>a.b0+S.tx.reduce((s,t)=>{if(!t.paid||t.card)return s;if(t.acc===a.id)s+=t.type==='in'?t.amount:-t.amount;if(t.type==='tr'&&t.to===a.id)s+=t.amount;return s},0);
const opt=(a,f)=>a.map(x=>[x.id,f(x)]);
function row(t){const c=cat(t.cat),late=!t.paid&&!t.card&&t.date<today&&t.type!=='tr';
const who=t.card?'💳 '+esc(card(t.card)?.name):esc((S.acc.find(a=>a.id===t.acc)||{}).name||'');
return `<div class="it"><div class="e">${t.type==='tr'?'🔁':c.e}</div><div class="m"><div>${esc(t.desc)}${late?'<span class="tag">atrasada</span>':''}</div><div class="k">${fd(t.date)} · ${t.type==='tr'?'Transferência':esc(c.name)} · ${who}</div></div><div class="${t.type==='in'?'in':t.type==='out'?'out':''}"><b>${t.type==='out'?'−':''}${brl(t.amount)}</b></div>${t.card||t.type==='tr'?'':`<button class="ic" data-a="pay" data-id="${t.id}" title="${t.paid?'Marcar pendente':'Marcar pago'}">${t.paid?'✅':'⬜'}</button>`}<button class="ic" data-a="del" data-id="${t.id}" aria-label="Excluir">✕</button></div>`}
const V={
home(){const m=monthTx(),inc=sum(m.filter(t=>t.type==='in')),ex=sum(m.filter(t=>t.type==='out'&&!t.inv));
const pend=S.tx.filter(t=>!t.paid&&!t.card&&t.type!=='tr').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
const al=S.cats.filter(c=>S.bud[c.id]&&spent(c.id)>=S.bud[c.id]*.8);
return `<div class="grid"><div class="card"><div class="k">Receitas</div><div class="v in">${brl(inc)}</div></div><div class="card"><div class="k">Despesas</div><div class="v out">${brl(ex)}</div></div><div class="card"><div class="k">Resultado</div><div class="v">${brl(inc-ex)}</div></div></div>
<h2>Contas <button data-a="newacc">+ Conta</button></h2><div class="card">${S.acc.map(a=>`<div class="it"><div class="e">🏦</div><div class="m">${esc(a.name)}</div><b>${brl(bal(a))}</b></div>`).join('')}<div class="row k" style="margin-top:6px"><span>Saldo total</span><b>${brl(S.acc.reduce((s,a)=>s+bal(a),0))}</b></div></div>
<h2>A pagar e receber</h2><div class="card">${pend.map(row).join('')||'<div class="empty">Nada pendente 🎉</div>'}</div>
${al.length?`<h2>Alertas de orçamento</h2><div class="card">${al.map(c=>`<div class="it"><div class="e">${c.e}</div><div class="m">${esc(c.name)}</div><span class="out">${Math.round(spent(c.id)/S.bud[c.id]*100)}% do limite</span></div>`).join('')}</div>`:''}
${S.tx.length?'':'<div class="card empty">Comece lançando uma despesa com o botão +.<br><br><button data-a="demo">Carregar dados de exemplo</button></div>'}
<p style="text-align:center"><button class="ghost" data-a="reset">Apagar todos os dados</button></p>`},
tx(){return `<div class="chips">${[['all','Todos'],['in','Receitas'],['out','Despesas'],['tr','Transf.']].map(f=>`<button data-a="flt" data-id="${f[0]}" class="${flt===f[0]?'on':''}">${f[1]}</button>`).join('')}</div><input id="q" placeholder="Buscar por descrição" value="${esc(q)}" aria-label="Buscar"><div class="card" id="list" style="margin-top:10px">${list()}</div>`},
cards(){return `<h2>Cartões <button data-a="newcard">+ Cartão</button></h2>${S.cards.map(c=>{const it=S.tx.filter(t=>t.card===c.id&&inv(t)===ym),tot=sum(it),open=sum(S.tx.filter(t=>t.card===c.id&&!t.paid)),pct=Math.min(100,open/c.limit*100);
return `<div class="card"><div class="row"><b>💳 ${esc(c.name)}</b><button data-a="payinv" data-id="${c.id}"${it.some(t=>!t.paid)?'':' disabled'}>Pagar fatura</button></div><div class="k">Fecha dia ${c.close} · vence dia ${c.due}<br>Compras feitas após o fechamento entram na fatura do mês seguinte.</div><div class="v out" style="margin:6px 0">Fatura de ${ml(ym)}: ${brl(tot)}</div><div class="k">Limite usado ${brl(open)} de ${brl(c.limit)}</div><div class="bar"><i class="${pct>80?'w':''}" style="width:${pct}%"></i></div>${it.map(row).join('')}</div>`}).join('')||'<div class="card empty">Nenhum cartão cadastrado.</div>'}`},
plan(){return `<h2>Limites por categoria <button data-a="newcat">+ Categoria</button></h2><div class="card">${S.cats.filter(c=>c.id!=='fat'&&c.id!=='renda').map(c=>{const l=S.bud[c.id]||0,s=spent(c.id),p=l?Math.min(100,s/l*100):0;return `<div class="it"><div class="e">${c.e}</div><div class="m"><div>${esc(c.name)}</div><div class="k">${brl(s)}${l?' de '+brl(l):' · sem limite'}</div>${l?`<div class="bar"><i class="${p>=100?'w':''}" style="width:${p}%"></i></div>`:''}</div><button class="ic" data-a="lim" data-id="${c.id}">Limite</button></div>`}).join('')}</div>
<h2>Metas <button data-a="newgoal">+ Meta</button></h2>${S.goals.map(g=>{const p=Math.min(100,g.saved/g.target*100);return `<div class="card"><div class="row"><b>🎯 ${esc(g.name)}</b><span class="k">${Math.round(p)}%</span></div><div class="k">${brl(g.saved)} de ${brl(g.target)}</div><div class="bar"><i style="width:${p}%"></i></div><div class="row" style="margin-top:8px"><button data-a="gadd" data-id="${g.id}">+ Guardar</button><button class="ghost" data-a="gdel" data-id="${g.id}">Excluir</button></div></div>`}).join('')||'<div class="card empty">Defina um objetivo, como reserva de emergência.</div>'}`},
rep(){const m=monthTx().filter(t=>t.type==='out'&&!t.inv),tot=sum(m),by=S.cats.map(c=>[c,sum(m.filter(t=>t.cat===c.id))]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
const ms=[5,4,3,2,1,0].map(n=>addM(ym,-n)).map(k=>{const t=S.tx.filter(x=>mon(x.date)===k);return[k,sum(t.filter(x=>x.type==='in')),sum(t.filter(x=>x.type==='out'&&!x.inv))]}),mx=Math.max(1,...ms.flatMap(x=>[x[1],x[2]]));
return `<h2>Despesas por categoria · ${ml(ym)}</h2><div class="card">${by.map(([c,v])=>`<div class="it"><div class="e">${c.e}</div><div class="m"><div class="row"><span>${esc(c.name)}</span><b>${brl(v)} <span class="k">${Math.round(v/tot*100)}%</span></b></div><div class="bar"><i style="width:${v/tot*100}%"></i></div></div></div>`).join('')||'<div class="empty">Sem despesas neste mês.</div>'}</div>
<h2>Receitas × despesas (6 meses)</h2><div class="card"><div class="bars">${ms.map(x=>`<div><i style="height:${x[1]/mx*100}px;background:var(--gn)" title="${brl(x[1])}"></i><i style="height:${x[2]/mx*100}px;background:var(--rd)" title="${brl(x[2])}"></i><br>${x[0].slice(5)}/${x[0].slice(2,4)}</div>`).join('')}</div><div class="k" style="margin-top:8px">Verde: receitas · Laranja: despesas</div></div>`}};
function list(){const r=S.tx.filter(t=>mon(t.date)===ym&&(flt==='all'||t.type===flt)&&t.desc.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));return r.map(row).join('')||'<div class="empty">Nenhum lançamento neste mês.</div>'}
function render(){$('#ml').textContent=ml(ym);$('#app').innerHTML=V[view]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));$('#warn').hidden=ok;const i=$('#q');if(i)i.oninput=e=>{q=e.target.value;$('#list').innerHTML=list()}}
function form(title,f,done,note=''){const d=$('#dlg');d.innerHTML=`<form><h3>${title}</h3>${note?`<p class="k">${note}</p>`:''}${f.map(x=>`<label data-k="${x.k}">${x.l}${x.t==='select'?`<select name="${x.k}">${x.o.map(o=>`<option value="${o[0]}"${o[0]==x.v?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input name="${x.k}" type="${x.t||'text'}"${x.t==='number'?' step="0.01" min="0" inputmode="decimal"':''} value="${esc(x.v)}" required>`}</label>`).join('')}<div class="row"><button type="button" class="ghost" data-a="close">Cancelar</button><button class="pri">Salvar</button></div></form>`;
d.querySelector('form').onsubmit=e=>{e.preventDefault();const o={};new FormData(e.target).forEach((v,k)=>o[k]=v);done(o);d.close()};const fm=d.querySelector('form'),sync=()=>f.forEach(x=>{if(!x.w)return;const on=!!x.w(k=>fm.elements[k]?.value),l=fm.querySelector(`[data-k="${x.k}"]`);l.hidden=!on;fm.elements[x.k].disabled=!on});fm.onchange=sync;sync();d.showModal()}
const A={
go(_,t){view=t.dataset.v;render();scrollTo(0,0)},pm(){ym=addM(ym,-1);render()},nm(){ym=addM(ym,1);render()},close(){$('#dlg').close()},flt(id){flt=id;render()},
pay(id){const t=S.tx.find(x=>x.id===id);t.paid=!t.paid;save()},del(id){S.tx=S.tx.filter(x=>x.id!==id);save()},
newtx(){form('Novo lançamento',[{k:'type',l:'Tipo',t:'select',v:'out',o:[['out','Despesa'],['in','Receita'],['tr','Transferência']]},{k:'desc',l:'Descrição',v:''},{k:'amount',l:'Valor (R$)',t:'number',v:''},{k:'date',l:'Data',t:'date',v:today},{k:'cat',l:'Categoria',t:'select',v:'outros',o:opt(S.cats,c=>c.e+' '+c.name),w:v=>v('type')!=='tr'},{k:'acc',l:'Conta',t:'select',v:S.acc[0].id,o:opt(S.acc,a=>a.name),w:v=>!(v('type')==='out'&&v('card'))},{k:'to',l:'Conta de destino',t:'select',v:S.acc[0].id,o:opt(S.acc,a=>a.name),w:v=>v('type')==='tr'},{k:'card',l:'Cartão de crédito (opcional)',t:'select',v:'',o:[['','— nenhum —'],...opt(S.cards,c=>c.name)],w:v=>v('type')==='out'&&S.cards.length},{k:'n',l:'Parcelas',t:'number',v:'1',w:v=>v('type')==='out'&&v('card')},{k:'paid',l:'Situação',t:'select',v:'1',o:[['1','Pago / recebido'],['0','Pendente']],w:v=>!(v('type')==='tr'||(v('type')==='out'&&v('card')))}],o=>{const amt=+o.amount;if(!(amt>0))return;
if(o.type==='out'&&o.card){const n=Math.max(1,Math.round(+o.n)),p=Math.round(amt/n*100)/100;for(let i=0;i<n;i++)S.tx.push({id:uid(),type:'out',desc:o.desc+(n>1?` (${i+1}/${n})`:''),amount:p,date:dAdd(o.date,i),cat:o.cat,card:o.card,paid:false})}
else S.tx.push({id:uid(),type:o.type,desc:o.desc,amount:amt,date:o.date,cat:o.cat,acc:o.acc,to:o.type==='tr'?o.to:undefined,paid:o.paid==='1'||o.type==='tr'});save()})},
newacc(){form('Nova conta',[{k:'name',l:'Nome',v:''},{k:'b0',l:'Saldo inicial (R$)',t:'number',v:'0'}],o=>{S.acc.push({id:uid(),name:o.name,b0:+o.b0});save()})},
newcard(){form('Novo cartão',[{k:'name',l:'Nome',v:''},{k:'limit',l:'Limite (R$)',t:'number',v:''},{k:'close',l:'Dia de fechamento',t:'number',v:'25'},{k:'due',l:'Dia de vencimento',t:'number',v:'5'}],o=>{S.cards.push({id:uid(),name:o.name,limit:+o.limit||1,close:+o.close,due:+o.due});save()})},
payinv(id){const c=card(id);form('Pagar fatura · '+esc(c.name),[{k:'acc',l:'Pagar com a conta',t:'select',v:S.acc[0].id,o:opt(S.acc,a=>a.name)}],o=>{const it=S.tx.filter(t=>t.card===id&&inv(t)===ym&&!t.paid);if(!it.length)return;it.forEach(t=>t.paid=true);S.tx.push({id:uid(),type:'out',inv:true,desc:'Fatura '+c.name,amount:sum(it),date:today,cat:'fat',acc:o.acc,paid:true});save()},`Total: ${brl(sum(S.tx.filter(t=>t.card===id&&inv(t)===ym&&!t.paid)))}`)},
newcat(){form('Nova categoria',[{k:'name',l:'Nome',v:''},{k:'e',l:'Ícone (emoji)',v:'🏷️'}],o=>{S.cats.push({id:uid(),name:o.name,e:o.e});save()})},
lim(id){form('Limite · '+esc(cat(id).name),[{k:'v',l:'Valor mensal (R$, 0 remove)',t:'number',v:S.bud[id]||''}],o=>{+o.v>0?S.bud[id]=+o.v:delete S.bud[id];save()})},
newgoal(){form('Nova meta',[{k:'name',l:'Objetivo',v:''},{k:'target',l:'Valor alvo (R$)',t:'number',v:''}],o=>{S.goals.push({id:uid(),name:o.name,target:+o.target||1,saved:0});save()})},
gadd(id){form('Guardar para a meta',[{k:'v',l:'Valor (R$)',t:'number',v:''}],o=>{S.goals.find(g=>g.id===id).saved+=+o.v;save()})},
